name: kiểm

# Cổng gác mọi thay đổi, kể cả thay đổi chỉ chạm README.md hay CONTRIBUTING.md —
# refresh.yml lọc paths nên không gác được những file đó. Job này KHÔNG ghi gì,
# không gọi mạng, không cần secret, nên không có đường nào tự kích hoạt lại mình.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kiem:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # `shell: bash` là bắt buộc, không phải trang trí: shell mặc định của
      # runner là `bash -e` KHÔNG có pipefail, nên `tee` sẽ nuốt exit code của
      # node và test đỏ hoá CI xanh. `shell: bash` chạy `bash -eo pipefail`.
      - name: Test
        shell: bash
        run: |
          node --test --test-reporter=tap | tee /tmp/tap.txt
          grep -qE '^1\.\.[1-9][0-9]*$' /tmp/tap.txt \
            || { echo '::error::không chạy test nào — file test bị đổi tên hay dời chỗ?'; exit 1; }

      - name: README phải khớp số liệu đã chốt
        run: node scripts/build.mjs --kiem
