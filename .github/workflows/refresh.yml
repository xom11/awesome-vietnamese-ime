name: refresh

# Job này gọi GitHub API lấy ★/lần push cuối/giấy phép rồi tự commit README.
#
# Đẩy bằng GITHUB_TOKEN — token phiên, hết job là chết, không có ngày hết hạn để
# quên gia hạn. Chạy được là nhờ Workflow permissions = Read and write (đặt ở
# org xom11 và ở repo này, 2026-08-09); trước đó cả hai đều là read nên job phải
# mượn một PAT. Nếu ai đó vặn hai setting đó về read, bước push sẽ đỏ với 403 —
# đó là chỗ cần nhìn trước tiên, đừng đi tìm token hỏng.
#
# Secret TOKEN_CAP_NHAT không còn được tham chiếu ở đâu nữa.

on:
  schedule:
    - cron: '0 3 * * 1'   # 03:00 UTC thứ 2 = 10:00 giờ Việt Nam
  push:
    branches: [main]
    # Hàng rào chống vòng lặp thật sự nằm ở tầng dưới: commit đẩy bằng
    # GITHUB_TOKEN KHÔNG kích hoạt workflow, GitHub chặn sẵn. Danh sách paths
    # dưới đây chỉ để khỏi chạy thừa. Nhưng nếu có ngày quay lại đẩy bằng PAT
    # thì nó thành hàng rào duy nhất — khi đó tuyệt đối không thêm 'README.md'
    # hay 'data/.snapshot.json' vào đây, vì job tự commit đúng hai file đó.
    paths:
      - 'data/ime.json'
      - 'scripts/**'
      - '.github/workflows/refresh.yml'
  pull_request:
    paths:
      - 'data/ime.json'
      - 'scripts/**'
      - '.github/workflows/refresh.yml'
  workflow_dispatch:

# contents: write là thứ cho phép bước push. kiem.yml giữ read — nó không ghi gì.
permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Không nạp token vào .git/config: bước push tự mang token của nó, nên
      # quyền ghi bị vặn về read chỉ làm đỏ đúng bước push chứ không kéo theo
      # cổng gác test ở trên.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # `node --test` trần, KHÔNG glob: `scripts/*.test.mjs` không khớp file nào
      # thì shell truyền nguyên chuỗi vào node, node báo "tests 0" rồi exit 0 —
      # cổng gác im lặng mở toang ngay trước bước ghi đè README và push lên main.
      - name: Chạy test trước khi cho phép ghi đè README
        run: node --test

      - name: Sinh README
        run: node scripts/build.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit nếu có thay đổi
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Chỉ soi đúng hai file job này được phép commit. `git status` trần sẽ
          # thấy bẩn vì bất cứ thứ gì khác rơi vào cây làm việc, rồi `git commit`
          # không có gì để commit và job đỏ vô cớ.
          co_thay_doi() { [ -n "$(git status --porcelain -- README.md data/.snapshot.json)" ]; }

          if ! co_thay_doi; then
            echo "Số liệu không đổi, không commit."
            exit 0
          fi

          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}"

          # Đẩy về đúng nhánh đang chạy, không cứng 'main': chạy thử bằng
          # workflow_dispatch trên một nhánh khác mà push HEAD:main là đẩy thẳng
          # cả nhánh đó vào main.
          nhanh='${{ github.ref_name }}'

          git add README.md data/.snapshot.json
          git commit -m "chore: cập nhật số liệu $(date -u +%Y-%m-%d)"

          # checkout ghim sha của sự kiện, nên nhánh nhúc nhích trong lúc job
          # chạy là push bị từ chối. README/snapshot là hàm thuần của dữ liệu
          # nên không có gì để merge: dựng lại trên đỉnh mới rồi đẩy tiếp.
          for lan in 1 2; do
            if git push "$remote" "HEAD:$nhanh"; then
              exit 0
            fi
            echo "::warning::push bị từ chối (lần $lan) — nhánh đã tiến, dựng lại trên đỉnh mới"
            git fetch "$remote" "$nhanh"
            git reset --hard FETCH_HEAD
            node scripts/build.mjs
            if ! co_thay_doi; then
              echo "Sau khi đồng bộ thì không còn gì để commit."
              exit 0
            fi
            git add README.md data/.snapshot.json
            git commit -m "chore: cập nhật số liệu $(date -u +%Y-%m-%d)"
          done

          echo "::error::push thất bại sau 2 lần dựng lại"
          exit 1
