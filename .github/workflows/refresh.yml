name: refresh

# Job này gọi GitHub API lấy ★/lần push cuối/giấy phép rồi tự commit README.
#
# Vì sao đẩy bằng PAT chứ không phải GITHUB_TOKEN: org xom11 chặn quyền ghi cho
# GITHUB_TOKEN ở cấp tổ chức. Secret TOKEN_CAP_NHAT là fine-grained PAT với
# Resource owner = xom11, chỉ repo này, Contents = Read and write.
#
# Nhánh dự phòng: nếu secret vắng (fork, hoặc token bị xoá), job vẫn chạy đủ
# test + build rồi dừng trước bước commit — XANH, không đỏ giả. Nó là code sống
# cho fork, đừng gỡ.
#
# Token hết hạn thì bước push đỏ, và chỉ bước push — checkout không nạp PAT nữa
# nên cổng gác test không mất theo. Đỏ là chủ ý, im lặng mới nguy.

on:
  schedule:
    - cron: '0 3 * * 1'   # 03:00 UTC thứ 2 = 10:00 giờ Việt Nam
  push:
    branches: [main]
    # KHÔNG thêm 'README.md' hay 'data/.snapshot.json' vào danh sách này.
    # Job tự commit đúng hai file đó bằng PAT, mà commit đẩy bằng PAT thì CÓ
    # kích hoạt workflow (khác GITHUB_TOKEN — GitHub chặn sẵn vòng lặp cho nó).
    # Hai tập không giao nhau chính là thứ duy nhất ngăn job tự gọi lại mình
    # vô hạn.
    paths:
      - 'data/ime.json'
      - 'scripts/**'
      - '.github/workflows/refresh.yml'
  pull_request:
    paths:
      - 'data/ime.json'
      - 'scripts/**'
      - '.github/workflows/refresh.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Xem có token để tự commit không
        id: token
        env:
          TOKEN_CAP_NHAT: ${{ secrets.TOKEN_CAP_NHAT }}
        run: |
          if [ -n "$TOKEN_CAP_NHAT" ]; then
            echo 'co=1' >> "$GITHUB_OUTPUT"
          else
            echo 'co=0' >> "$GITHUB_OUTPUT"
            echo "::notice::Chưa có secret TOKEN_CAP_NHAT — lần chạy này chỉ kiểm dữ liệu và dựng thử README, không tự commit. Thêm secret là bật được tự cập nhật, không phải sửa file này."
          fi

      # Không nạp token vào checkout: persist-credentials mặc định ghi thẳng
      # thông tin đăng nhập vào .git/config và giữ đó suốt job. Bước push tự
      # mang token của nó, nên PAT hết hạn chỉ làm đỏ đúng bước push.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # `node --test` trần, KHÔNG glob: `scripts/*.test.mjs` không khớp file nào
      # thì shell truyền nguyên chuỗi vào node, node báo "tests 0" rồi exit 0 —
      # cổng gác im lặng mở toang ngay trước bước ghi đè README và push lên main.
      - name: Chạy test trước khi cho phép ghi đè README
        run: node --test

      - name: Sinh README
        run: node scripts/build.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit nếu có thay đổi
        if: github.event_name != 'pull_request' && steps.token.outputs.co == '1'
        env:
          TOKEN: ${{ secrets.TOKEN_CAP_NHAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Chỉ soi đúng hai file job này được phép commit. `git status` trần sẽ
          # thấy bẩn vì bất cứ thứ gì khác rơi vào cây làm việc, rồi `git commit`
          # không có gì để commit và job đỏ vô cớ.
          co_thay_doi() { [ -n "$(git status --porcelain -- README.md data/.snapshot.json)" ]; }

          if ! co_thay_doi; then
            echo "Số liệu không đổi, không commit."
            exit 0
          fi

          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          remote="https://x-access-token:${TOKEN}@github.com/${{ github.repository }}"

          git add README.md data/.snapshot.json
          git commit -m "chore: cập nhật số liệu $(date -u +%Y-%m-%d)"

          # checkout ghim sha của sự kiện, nên main nhúc nhích trong lúc job chạy
          # là push bị từ chối và lỗi đó rất dễ bị chẩn đoán nhầm thành "PAT hết
          # hạn". README/snapshot là hàm thuần của dữ liệu nên không có gì để
          # merge: dựng lại trên đỉnh mới rồi đẩy tiếp.
          for lan in 1 2; do
            if git push "$remote" HEAD:main; then
              exit 0
            fi
            echo "::warning::push bị từ chối (lần $lan) — main đã tiến, dựng lại trên đỉnh mới"
            git fetch "$remote" main
            git reset --hard FETCH_HEAD
            node scripts/build.mjs
            if ! co_thay_doi; then
              echo "Sau khi đồng bộ thì không còn gì để commit."
              exit 0
            fi
            git add README.md data/.snapshot.json
            git commit -m "chore: cập nhật số liệu $(date -u +%Y-%m-%d)"
          done

          echo "::error::push thất bại sau 2 lần dựng lại"
          exit 1
