name: refresh

# Tự cập nhật số liệu đang TẮT, và tắt một cách có chủ ý.
#
# Org xom11 chặn quyền ghi cho GITHUB_TOKEN ở cấp tổ chức, nên muốn job tự
# commit thì phải đẩy bằng fine-grained PAT. Chừng nào chưa có secret
# TOKEN_CAP_NHAT, workflow vẫn chạy đủ test + build (đủ để gác PR và để biết
# cỗ máy còn sống) rồi dừng trước bước commit — job XANH, không đỏ giả.
#
# Bật tự cập nhật: tạo fine-grained PAT với Resource owner = xom11, chỉ repo
# này, quyền Contents = Read and write (Metadata = Read tự kèm), rồi thêm vào
# Settings → Secrets and variables → Actions với tên TOKEN_CAP_NHAT. Không
# phải sửa file này. Token hết hạn thì bước push đỏ — chủ ý, im lặng mới nguy.

on:
  schedule:
    - cron: '0 3 * * 1'   # 03:00 UTC thứ 2 = 10:00 giờ Việt Nam
  push:
    branches: [main]
    paths:
      - 'data/ime.json'
      - 'scripts/**'
      - '.github/workflows/refresh.yml'
  pull_request:
    paths:
      - 'data/ime.json'
      - 'scripts/**'
      - '.github/workflows/refresh.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Xem có token để tự commit không
        id: token
        env:
          TOKEN_CAP_NHAT: ${{ secrets.TOKEN_CAP_NHAT }}
        run: |
          if [ -n "$TOKEN_CAP_NHAT" ]; then
            echo 'co=1' >> "$GITHUB_OUTPUT"
          else
            echo 'co=0' >> "$GITHUB_OUTPUT"
            echo "::notice::Chưa có secret TOKEN_CAP_NHAT — lần chạy này chỉ kiểm dữ liệu và dựng thử README, không tự commit. Thêm secret là bật được tự cập nhật, không phải sửa file này."
          fi

      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN_CAP_NHAT || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Chạy test trước khi cho phép ghi đè README
        run: node --test scripts/*.test.mjs

      - name: Sinh README
        run: node scripts/build.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit nếu có thay đổi
        if: github.event_name != 'pull_request' && steps.token.outputs.co == '1'
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Số liệu không đổi, không commit."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md data/.snapshot.json
          git commit -m "chore: cập nhật số liệu $(date -u +%Y-%m-%d)"
          git push
